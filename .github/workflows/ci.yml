name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node 24, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          # The CLI tests read a spec through `git show HEAD:...`.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Build first: the Node integrations type-check against each other's
      # declarations and their tests serve the built bundle.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Copy the bundle into the Python packages
        run: node scripts/copy-python-bundles.mjs
      - name: Versions agree
        run: node scripts/version.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Django integration
        working-directory: integrations/django
        run: |
          python -m pip install --quiet "django>=4.2"
          python runtests.py
      - name: FastAPI integration
        working-directory: integrations/fastapi
        run: |
          python -m pip install --quiet fastapi httpx2
          python runtests.py
