name: Release

# Push a tag to release every package at once:
#   node scripts/version.mjs 0.2.0 && git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches every package version
        run: node scripts/version.mjs --check "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/copy-python-bundles.mjs

      - name: Pack npm packages
        run: |
          mkdir -p dist/npm
          pnpm --filter @binarycastle/apidoc pack --pack-destination "$PWD/dist/npm"
          pnpm --filter @binarycastle/apidoc-cli pack --pack-destination "$PWD/dist/npm"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test and build Python packages
        run: |
          python -m pip install --quiet build twine "django>=4.2" fastapi httpx2
          (cd integrations/django && python runtests.py)
          (cd integrations/fastapi && python runtests.py)
          python -m build integrations/django --outdir dist/python
          python -m build integrations/fastapi --outdir dist/python
          python -m twine check --strict dist/python/*

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance and trusted publishing use the workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        # NPM_TOKEN is needed for the very first release; afterwards configure
        # trusted publishing on npmjs.com and the secret can be removed.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in dist/npm/*.tgz; do
            npm publish "$tarball" --access public --provenance
          done

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing: no API token stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python

  github-release:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/npm/*.tgz dist/python/*
