[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apidoc-django"
version = "0.1.0"
description = "Serve the apidoc API reference and playground from your Django project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apidoc_django"]
# The JS bundle is a build output (gitignored), so it has to be listed explicitly.
artifacts = ["src/apidoc_django/static/apidoc_django/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "runtests.py", "README.md"]
artifacts = ["src/apidoc_django/static/apidoc_django/**"]
