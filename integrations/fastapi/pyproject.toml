[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apidoc-fastapi"
version = "0.1.0"
description = "Serve the apidoc API reference and playground from your FastAPI app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apidoc_fastapi"]
# The JS bundle is a build output (gitignored), so it has to be listed explicitly.
artifacts = ["src/apidoc_fastapi/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "runtests.py", "README.md"]
artifacts = ["src/apidoc_fastapi/static/**"]
